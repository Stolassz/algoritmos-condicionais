<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listas - Estrutura de decisão</title>
    <style>
        body {
            background: linear-gradient(to right, rgb(22, 22, 85), rgb(43, 26, 236));
        }

        h1 {
            text-align: center;
            color: white;
            font-family: 'Asap', sans-serif;
            font-size: 2.5rem;
            padding: 1.5rem;
            margin-top: 2.5rem;
            text-shadow: 2px 2px 2px rgba(0, 0, 0, 0.222);
        }

        input {
            width: 14rem;
            background-color: rgb(184, 183, 183);
            border: none;
            padding: 2rem;
            margin: 0.5rem;
            cursor: pointer;
            font-family: 'Asap', sans-serif;
            font-size: 1rem;
            border-radius: 0.5rem;
            box-shadow: 2px 2px 2px 2px rgba(0, 0, 0, 0.222);
        }

        input:hover {
            background-color: rgb(120, 115, 166);
            color: white;
        }
    </style>
</head>

<body>
    <main>
        <h1>Exercício de algoritmos condicionais</h1>

        <div style="display: flex; flex-wrap: wrap; justify-content: center;">
            <input onclick="somaMaior()" type="button" value="Questão 1">
            <input onclick="tempoCasamento()" type="button" value="Questão 2">
            <input onclick="imparPar()" type="button" value="Questão 3">
            <input onclick="valoresIguais()" type="button" value="Questão 4">
            <input onclick="valorPositivoNegativo()" type="button" value="Questão 5">
            <input onclick="valorBooleano()" type="button" value="Questão 6">
            <input onclick="lerVariaveis()" type="button" value="Questão 7">
            <input onclick="ordenarDecrescente()" type="button" value="Questão 8">
            <input onclick="pesoIdeal()" type="button" value="Questão 9">
            <input onclick="descobrirImc()" type="button" value="Questão 10">
            <input onclick="verDesconto()" type="button" value="Questão 11">
            <input onclick="verificarMedia()" type="button" value="Questão 12">
        </div>
    </main>
    <script src="script.js"></script>
</body>

</html>
